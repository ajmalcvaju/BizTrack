name: bizpilot
description: "BizPilot - Business Manager Android App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  csv: ^6.0.0
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
